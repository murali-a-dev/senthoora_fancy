<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="70%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura background glow -->
  <circle cx="250" cy="250" r="230" fill="url(#auraGlow)" />
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#goldShimmer)" stroke-width="3" stroke-dasharray="6,8" opacity="0.8" />
  <circle cx="250" cy="250" r="205" fill="none" stroke="url(#roseGold)" stroke-width="2" opacity="0.6" />

  <!-- Center Auspicious Lotus / Tiara Motifs -->
  <g transform="translate(250, 220)">
    <!-- Outer Petals -->
    <path d="M 0,40 C -80,10 -110,-40 -80,-80 C -50,-40 -20,-10 0,40 Z" fill="url(#roseGold)" opacity="0.85" />
    <path d="M 0,40 C 80,10 110,-40 80,-80 C 50,-40 20,-10 0,40 Z" fill="url(#roseGold)" opacity="0.85" />

    <!-- Secondary Petals -->
    <path d="M 0,40 C -50,0 -80,-50 -45,-105 C -25,-60 -10,-20 0,40 Z" fill="url(#goldShimmer)" opacity="0.9" />
    <path d="M 0,40 C 50,0 80,-50 45,-105 C 25,-60 10,-20 0,40 Z" fill="url(#goldShimmer)" opacity="0.9" />

    <!-- Central Crown Petal -->
    <path d="M 0,40 C -30,-20 -35,-80 0,-130 C 35,-80 30,-20 0,40 Z" fill="url(#roseGold)" />

    <!-- Bindi / Jewel Drop -->
    <circle cx="0" cy="-60" r="9" fill="url(#goldShimmer)" filter="url(#softGlow)" />
    <circle cx="0" cy="-30" r="6" fill="#ffffff" opacity="0.9" />
    <circle cx="0" cy="0" r="4" fill="url(#goldShimmer)" />

    <!-- Ornamental Bangle Ring Underneath -->
    <ellipse cx="0" cy="50" rx="95" ry="18" fill="none" stroke="url(#goldShimmer)" stroke-width="5" />
    <ellipse cx="0" cy="50" rx="90" ry="15" fill="none" stroke="url(#roseGold)" stroke-width="2" />
    <circle cx="-60" cy="50" r="4" fill="#fbbf24" />
    <circle cx="-30" cy="53" r="4" fill="#f43f5e" />
    <circle cx="0" cy="54" r="5" fill="#fbbf24" />
    <circle cx="30" cy="53" r="4" fill="#f43f5e" />
    <circle cx="60" cy="50" r="4" fill="#fbbf24" />
  </g>

  <!-- Typography Element -->
  <text x="250" y="340" text-anchor="middle" font-family="'Playfair Display', serif" font-size="34" font-weight="700" fill="url(#roseGold)" letter-spacing="3">
    SRI SENTHOORA
  </text>
  <text x="250" y="375" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="url(#goldShimmer)" letter-spacing="7">
    FANCY STORE
  </text>
  <text x="250" y="405" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#9ca3af" letter-spacing="4">
    EXQUISITE SHOWCASE
  </text>
</svg>
